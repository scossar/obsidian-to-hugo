[project]
name = "obsidian-to-hugo"
version = "0.1.0"
description = "Export an Obsidian note and its images to Hugo"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
obsidian-to-hugo = "obsidian_to_hugo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["obsidian_to_hugo.py"]
